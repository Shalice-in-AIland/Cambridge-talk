<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompted but misheard · LTRC Seminar · Dr Sha Liu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0a0a14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      transition: opacity 0.25s ease;
    }
    .slide-frame.loading { opacity: 0; }

    /* Navigation bar */
    .nav {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 28px;
      background: rgba(15, 15, 25, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 30px;
      border-radius: 999px;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      z-index: 1000;
      transition: opacity 0.3s ease;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      opacity: 0.45;
    }
    .nav:hover { opacity: 1; }
    .nav-fs-group { display: flex; align-items: center; gap: 14px; }
    .nav button {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    .nav button:hover { background: rgba(255,255,255,0.25); }
    .nav button:active { transform: scale(0.95); }
    .nav-counter {
      min-width: 90px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      letter-spacing: 0.5px;
      font-size: 14px;
    }
    .nav-counter .current { font-weight: 700; font-size: 16px; }
    .nav-divider {
      width: 1px;
      height: 26px;
      background: rgba(255,255,255,0.18);
    }
    .nav-section {
      max-width: 360px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.78);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
    }
    .nav-fs {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .nav-fs:hover { background: rgba(255,255,255,0.25); }

    /* Overview grid */
    .overview {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 20, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
      z-index: 2000;
      overflow-y: auto;
    }
    .overview.open { display: flex; }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-width: 1400px;
      width: 100%;
    }
    .overview-thumb {
      aspect-ratio: 16 / 10;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      border: 2px solid transparent;
      transition: border-color 0.15s ease, transform 0.15s ease;
      display: flex;
      flex-direction: column;
    }
    .overview-thumb:hover {
      border-color: #8B5CF6;
      transform: translateY(-2px);
    }
    .overview-thumb.current { border-color: #C2410C; }
    .overview-thumb-number {
      position: absolute;
      top: 6px;
      left: 8px;
      background: rgba(0,0,0,0.65);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      z-index: 2;
    }
    .overview-thumb-frame {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none;
      transform: scale(0.25);
      transform-origin: top left;
      width: 400%;
      height: 400%;
    }
    .overview-thumb-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: #ffffff;
      font-size: 10.5px;
      padding: 4px 8px;
      text-align: center;
      z-index: 2;
    }
    .overview-close {
      position: fixed;
      top: 24px;
      right: 24px;
      background: rgba(255,255,255,0.15);
      color: #ffffff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      z-index: 2001;
    }

    /* Help hint */
    .help-hint {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(15, 15, 25, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.75);
      padding: 6px 12px;
      border-radius: 12px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      z-index: 999;
      transition: opacity 0.3s ease;
      opacity: 0.35;
    }
    .help-hint:hover { opacity: 1; }
    .help-hint kbd {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      color: #ffffff;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 10px;
      margin: 0 2px;
    }
  </style>
</head>
<body>

  <div class="stage">
    <iframe class="slide-frame" id="slideFrame" src="" allow="autoplay; fullscreen"></iframe>
  </div>

  <div class="nav" id="nav">
    <button onclick="prev()" aria-label="Previous slide">‹</button>
    <div class="nav-counter">
      <span class="current" id="counter-current">1</span> <span style="opacity:0.5;">/</span> <span id="counter-total">18</span>
    </div>
    <button onclick="next()" aria-label="Next slide">›</button>
    <div class="nav-divider"></div>
    <div class="nav-section" id="nav-section">Title</div>
    <div class="nav-divider"></div>
    <div class="nav-fs-group">
      <button class="nav-fs" onclick="openOverview()">View</button>
      <button class="nav-fs" onclick="toggleFullscreen()">Full</button>
    </div>
  </div>

  <div class="help-hint" id="help-hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate · <kbd>F</kbd> fullscreen · <kbd>O</kbd> view · <kbd>Esc</kbd> exit
  </div>

  <div class="overview" id="overview">
    <button class="overview-close" onclick="closeOverview()" aria-label="Close overview">×</button>
    <div class="overview-grid" id="overview-grid"></div>
  </div>

  <script>
    const slides = [
      { file: 'slide_title_ltrc.html', section: 'Title', label: 'Title — LTRC Seminar' },
      { file: 'slide_probing_questions_aala.html', section: 'Before the demo', label: 'Listen for filled pauses &amp; hesitation' },
      { file: 'slide_live_demo.html', section: 'The demo', label: 'The demo — Claude voice mode vs AiBC' },
      { file: 'slide_live_demo_transcript.html', section: 'The demo · backup', label: 'The demo — transcript (backup view)' },
      { file: 'slide_prompts_used.html', section: 'Prompting', label: 'The prompts behind the demo' },
      { file: 'slide_prompting_reach.html', section: 'Prompting', label: 'What prompting can reach' },
      { file: 'slide_prompting_limits.html', section: 'Prompting', label: 'What prompting cannot reach — and what it only seems to reach' },
      { file: 'slide_interlocutor_combined.html', section: 'What research has shown', label: 'AI as Interlocutor — five roles + 4 studies' },
      { file: 'slide_pipeline_assessment.html', section: 'What research has shown', label: 'The architecture beneath the cap (Tier 1)' },
      { file: 'slide_IC_continuum_experiments.html', section: 'What research has shown', label: 'IC research and the continuum' },
      { file: 'slide_pipeline_tech.html', section: 'Architecture · alternatives', label: 'Three alternative pipelines' },
      { file: 'slide_evaluator_combined.html', section: 'This study · the role', label: 'AI as Evaluator — the role under test' },
      { file: 'slide_asr_demo.html#step=0', section: 'This study · 1 of 6', label: 'What the ASR heard — real learner turns' },
      { file: 'slide_asr_demo.html#step=1', section: 'This study · 2 of 6', label: 'ASR issues and impact on feedback' },
      { file: 'slide_asr_demo.html#step=2', section: 'This study · 3 of 6', label: 'The question — personalised feedback?' },
      { file: 'slide_asr_demo.html#step=3', section: 'This study · 4 of 6', label: 'This study — two prompts, results, models' },
      { file: 'slide_asr_demo.html#step=4', section: 'This study · 5 of 6', label: 'Voice engines with Chinese L1 — Deepgram' },
      { file: 'slide_asr_demo.html#step=5', section: 'This study · 6 of 6', label: 'Voice engines with Chinese L1 — ElevenLabs' },
      { file: 'slide_ai_literacy_speaking.html', section: 'Synthesis', label: 'AI literacy in speaking assessment' },
      { file: 'slide_clark_call.html', section: 'Join in', label: 'Call for contributors — CLARK Field Guides' },
      { file: 'slide_thank_you.html', section: 'Thank you', label: 'Thank you · Questions?' },
    ];


    // --- background warm-up: prefetch next slide + all assets so later slides load instantly ---
    const warmed = new Set();
    function warmFetch(f) {
      if (warmed.has(f)) return Promise.resolve();
      warmed.add(f);
      return fetch(f, { cache: 'force-cache' }).catch(() => {});
    }
    function prefetchNext() {
      const n = slides[current + 1];
      if (n) warmFetch(n.file.split('#')[0]);
    }
    window.addEventListener('load', () => {
      setTimeout(() => {
        const docs = [...new Set(slides.map(s => s.file.split('#')[0]))];
        const media = ['AiBC-Speaking.gif','AiBC.gif','CLARK1.png','CLARK2.png','british-council.jpg',
                       'cfp_hero.png','clark-avatar.png','claude-logo.webp','live_demo_clip_90s.mp3',
                       'role_auditor.png','role_evaluator.png','role_generator.png',
                       'role_interlocutor.png','role_mediator.png'];
        [...docs, ...media].reduce((p, f) => p.then(() => warmFetch(f)), Promise.resolve());
      }, 1500);
    });

    const frame = document.getElementById('slideFrame');
    const counterCurrent = document.getElementById('counter-current');
    const counterTotal = document.getElementById('counter-total');
    const navSection = document.getElementById('nav-section');
    const nav = document.getElementById('nav');
    const helpHint = document.getElementById('help-hint');
    const overview = document.getElementById('overview');

    let current = 0;
    counterTotal.textContent = slides.length;

    function update() {
      const target = slides[current].file;
      const tBase = target.split('#')[0];
      const cBase = (frame.getAttribute('src') || '').split('#')[0];
      if (tBase === cBase && cBase) {
        frame.src = target;                 // fragment-only change: no reload, no load event
        frame.classList.remove('loading');
        try { window.focus(); } catch (e) {}
      } else {
        frame.classList.add('loading');
        frame.src = target;
      }
      prefetchNext();
      counterCurrent.textContent = current + 1;
      navSection.textContent = slides[current].section;
      document.querySelectorAll('.overview-thumb').forEach((t, i) => {
        t.classList.toggle('current', i === current);
      });
    }

    frame.addEventListener('load', () => {
      frame.classList.remove('loading');
      try {
        const doc = frame.contentDocument;
        if (doc) {
          doc.addEventListener('keydown', handleKey);
        }
      } catch (e) {}
      try { window.focus(); } catch (e) {}
    });

    function next() {
      if (current < slides.length - 1) {
        current++;
        update();
      }
    }
    function prev() {
      if (current > 0) {
        current--;
        update();
      }
    }
    function go(n) {
      if (n >= 0 && n < slides.length) {
        current = n;
        update();
        closeOverview();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    function openOverview() {
      overview.classList.add('open');
      if (overview.querySelector('.overview-thumb') === null) {
        const grid = document.getElementById('overview-grid');
        slides.forEach((s, i) => {
          const thumb = document.createElement('div');
          thumb.className = 'overview-thumb' + (i === current ? ' current' : '');
          thumb.onclick = () => go(i);
          thumb.innerHTML = `
            <div class="overview-thumb-number">${i + 1}</div>
            <iframe class="overview-thumb-frame" src="${s.file}" scrolling="no"></iframe>
            <div class="overview-thumb-label">${s.label}</div>
          `;
          grid.appendChild(thumb);
        });
      }
    }
    function closeOverview() {
      overview.classList.remove('open');
    }

    function handleKey(e) {
      if (overview.classList.contains('open')) {
        if (e.key === 'Escape') closeOverview();
        return;
      }
      const target = e.target;
      const tag = target && target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (target && target.isContentEditable)) {
        return;
      }
      switch (e.key) {
        case 'ArrowRight':
        case 'PageDown':
        case ' ':
          e.preventDefault();
          next();
          break;
        case 'ArrowLeft':
        case 'PageUp':
          e.preventDefault();
          prev();
          break;
        case 'Home':
          e.preventDefault();
          go(0);
          break;
        case 'End':
          e.preventDefault();
          go(slides.length - 1);
          break;
        case 'f':
        case 'F':
          toggleFullscreen();
          break;
        case 'o':
        case 'O':
          openOverview();
          break;
        case 'Escape':
          if (document.fullscreenElement) document.exitFullscreen();
          break;
      }
    }
    document.addEventListener('keydown', handleKey);
    window.addEventListener('keydown', handleKey);

    function applyHash() {
      const h = window.location.hash.replace('#', '');
      const n = parseInt(h, 10);
      if (!isNaN(n) && n >= 1 && n <= slides.length) {
        current = n - 1;
        update();
      }
    }
    window.addEventListener('hashchange', applyHash);

    // Safari fix: wait for DOMContentLoaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        update();
        applyHash();
      });
    } else {
      update();
      applyHash();
    }
  </script>

</body>
</html>
